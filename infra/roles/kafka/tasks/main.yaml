- name: create kafka service account
  include_role:
    name: service_account
  vars:
    account_name: kafka

- name: make download directory
  file:
    path: /tmp/kafka_download
    mode: 0755
    state: directory

- name: make kafka directory
  file:
    path: "/opt/kafka"
    owner: kafka
    group: kafka
    mode: 0755
    state: directory

- name: does keystore exist
  stat:
    path: /opt/kafka/broker.keystore.jks
  register: keystore_exists_result

- block:
  - name: create jks key store
    community.general.java_keystore:
      name: broker-cert
      dest: /opt/kafka/broker.keystore.jks
      password: "{{ lookup('file', '../secrets/jks_password') }}"
      private_key: "{{ lookup('file', '../secrets/external_key.pem') }}"
      certificate: "{{ lookup('file', '../secrets/external_cert.pem') }}"
      group: kafka
      owner: kafka
      mode: 0640

  - name: copy over the ca root
    copy:
      src: ../secrets/external_ca.pem
      dest: /opt/kafka/external_ca.pem
      owner: kafka
      group: kafka
      mode: "0644"

#  - name: create jks trust store
#    community.crypto.openssl_pkcs12:
#      action: export
#      path: /opt/kafka/broker.truststore.p12
#      friendly_name: ca-root
#      certificate_path: /opt/kafka/external_ca.pem
#      passphrase: "{{ lookup('file', '../secrets/jks_password') }}"
#      state: present
#      owner: kafka
#      group: kafka
#      mode: 0640

  - name: create jks trust store
    command:
      cmd: >
        keytool -importcert -noprompt
          -file /opt/kafka/external_ca.pem 
          -alias ca-root -storepass {{ lookup('file', '../secrets/jks_password') }}
          -keystore /opt/kafka/broker.truststore.jks
    args:
      creates: /opt/kafka/broker.truststore.jks

  - name: change jks ownership
    file:
      path: /opt/kafka/broker.truststore.jks
      owner: kafka
      group: kafka
      mode: '0640'

#  - name: create jks trust store
#    community.general.java_cert:
#      cert_alias: ca-root
#      cert_content: "{{ lookup('file', '../secrets/external_ca.pem') }}"
#      trust_cacert: true
#      keystore_pass: "password"
#      keystore_path: /opt/kafka/broker.truststore.jks
#      keystore_create: true
#      group: kafka
#      owner: kafka
#      state: present
  when: keystore_exists_result.stat.exists == false

- name: make kafka logs directory
  file:
    path: "/opt/kafka/kafka-logs"
    owner: kafka
    group: kafka
    mode: 0755
    state: directory

- name: create file system on device
  filesystem:
    dev: /dev/nvme1n1
    fstype: xfs

- name: mount device for volume
  mount:
    state: mounted
    path: /opt/kafka/kafka-logs
    src: /dev/nvme1n1
    fstype: xfs

- name: create data directory
  file:
    path: "/opt/kafka/kafka-logs/data"
    owner: kafka
    group: kafka
    mode: 0750
    state: directory

- name: is kafka downloaded
  stat:
    path: "/tmp/kafka_download/{{ kafka_artifact }}"
  register: kafka_download_exists_result

- name: download kafka zip file
  get_url:
    url: "https://downloads.apache.org/kafka/{{ kafka_version }}/{{ kafka_artifact }}"
    dest: "/tmp/kafka_download"
  when: kafka_download_exists_result.stat.exists == false

- name: install
  block:
    - name: download jmx jar
      get_url:
        url: https://github.com/prometheus/jmx_exporter/releases/download/1.6.0/jmx_prometheus_javaagent-1.6.0.jar
#        url: "https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.6.0/jmx_prometheus_javaagent-1.6.0.jar"
        dest: "/tmp/kafka_download"

    - name: unarchive kafka
      unarchive:
        src: "/tmp/kafka_download/{{ kafka_artifact }}"
        dest: "/opt/kafka"
        owner: kafka
        group: kafka
        remote_src: yes

    - name: copy jmx jar to libs
      copy:
        src: "/tmp/kafka_download/jmx_prometheus_javaagent-1.6.0.jar"
        dest: "/opt/kafka/{{ kafka_name }}/libs"
        owner: kafka
        group: kafka
        remote_src: yes

    - name: copy jmx configuration
      copy:
        src: "jmx_configuration.yaml"
        dest: "/opt/kafka/{{ kafka_name }}/config"
        owner: kafka
        group: kafka
  when: kafka_download_exists_result.stat.exists == false
#- name: copy kafka archive
#  copy:
#    src: "{{ kafka_artifact }}"
#    dest: "/tmp/kafka_download/{{ kafka_artifact }}"
#  when: kafka_download_exists_result.stat.exists == false

- name: create service file
  copy:
    src: kafka.service
    dest: /etc/systemd/system/kafka.service
    mode: 0644
  notify:
    - start kafka

- name: server properties template
  block:
    - name:
      template:
        src: server.properties.j2
        dest: "/opt/kafka/{{ kafka_name }}/config/server.properties"
        owner: kafka
        group: kafka
        mode: 0644
      vars:
        node_name: "{{ ansible_facts['hostname'] }}.podspace.internal"
        external_node_name: "{{ ansible_facts['hostname'] }}.podspace.net"
        jks_password: "{{ lookup('file', '../secrets/jks_password') }}"

    - name: is kraft initialized
      stat:
        path: "/opt/kafka/kafka-logs/data/meta.properties"
      register: kraft_initialized

    - name: create kraft meta log
      shell:
        chdir: "/opt/kafka/{{kafka_name}}"
        cmd: |
          bin/kafka-storage.sh format -t {{ raft_id }} -c config/server.properties
      when: kraft_initialized.stat.exists == false

    - name: update meta log ownership
      file:
        path: "/opt/kafka/kafka-logs"
        owner: kafka
        group: kafka
        recurse: true

  when: not zookeeper

- name: server properties zk template
  template:
    src: server.properties.zk.j2
    dest: "/opt/kafka/{{ kafka_name }}/config/server.properties"
    owner: kafka
    group: kafka
    mode: 0644
  vars:
    node_name: "{{ ansible_facts['hostname'] }}.podspace.internal"
  when: zookeeper

- name: set up kafka as consul service
  template:
    src: kafka-broker-consul.json.j2
    dest: /etc/consul.d/kafka-broker-consul.json
    owner: consul
    group: consul
    mode: 0644
  vars:
    node_name: "{{ ansible_facts['hostname'] }}.podspace.internal"
  notify: reload consul
