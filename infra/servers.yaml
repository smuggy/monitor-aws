- name: configure prometheus servers
  hosts: prom_servers
  become: yes
  roles:
    - alertmanager
    - prometheus
    - grafana
    - nginx
    - prom_nginx_config

- name: post consul actions
  hosts: consul_servers
  become: yes
  roles:
